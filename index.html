<!DOCTYPE html>
<html>
<head>
  <base href="/ESL_WEBAPP_test/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="台灣兒童美語協會ESL美語教學軟體">
  <link rel="apple-touch-icon" href="assets/assets/icons/word_icon.svg">

  <title>台灣兒童美語協會ESL美語教學軟體</title>
  <link rel="manifest" href="manifest.json">

  <!-- 環境變數設定 -->
  <script>
    // 直接在 window 上定義環境變數，替代 .env 檔案
    window.flutterEnvironment = {
      APP_NAME: '台灣兒童美語協會ESL美語教學軟體',
      APP_VERSION: '1.0.0',
      API_BASE_URL: 'https://api.example.com',
      API_TIMEOUT: '30000',
      AUDIO_CACHE_SIZE: '100',
      AUDIO_CACHE_DURATION: '3600',
      GAME_MAX_LEVEL: '10',
      GAME_DIFFICULTY_INTERVAL: '2'
    };
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "3974295427";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
